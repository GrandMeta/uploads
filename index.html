<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>File Directory</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f4f6f8;
      margin: 0;
      padding: 0;
    }

    header {
      background-color: #2a3f54;
      color: white;
      padding: 16px 24px;
      font-size: 1.5em;
    }

    .container {
      max-width: 700px;
      margin: 40px auto;
      background: white;
      border-radius: 8px;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
      padding: 20px;
    }

    .file {
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid #eee;
      padding: 10px 0;
    }

    .file:last-child {
      border-bottom: none;
    }

    .file a {
      color: #007acc;
      text-decoration: none;
      font-weight: 500;
    }

    .file button {
      background: #007acc;
      color: white;
      border: none;
      padding: 6px 12px;
      border-radius: 4px;
      cursor: pointer;
      font-size: 0.9em;
      transition: background 0.3s;
    }

    .file button:hover {
      background: #005fa3;
    }

    .copied {
      background: #4caf50 !important;
    }
  </style>
</head>
<body>
  <header>📂 File Directory</header>

  <div class="container" id="fileList">
    <div class="file">
      <a href="https://example.com/files/report.pdf" target="_blank">report.pdf</a>
      <button onclick="copyLink('https://example.com/files/report.pdf', this)">Copy Link</button>
    </div>
    <div class="file">
      <a href="https://example.com/files/image.png" target="_blank">image.png</a>
      <button onclick="copyLink('https://example.com/files/image.png', this)">Copy Link</button>
    </div>
    <div class="file">
      <a href="https://example.com/files/presentation.pptx" target="_blank">presentation.pptx</a>
      <button onclick="copyLink('https://example.com/files/presentation.pptx', this)">Copy Link</button>
    </div>
  </div>

  <script>
    function copyLink(link, button) {
      navigator.clipboard.writeText(link)
        .then(() => {
          button.textContent = 'Copied!';
          button.classList.add('copied');
          setTimeout(() => {
            button.textContent = 'Copy Link';
            button.classList.remove('copied');
          }, 1500);
        })
        .catch(err => alert('Failed to copy: ' + err));
    }
  </script>
</body>
</html>
