<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>GrandMeta Uploads</title>
  <meta name="description" content="Browse and share GrandMeta uploads with quick copy links." />
  <style>
    :root{
      --bg: #eef3ff;
      --panel: #ffffff;
      --text: #1c1c28;
      --muted: #626d92;
      --accent1: #6c63ff;
      --accent2: #00d4ff;
      --ring: rgba(108,99,255,0.4);
      --btn: linear-gradient(135deg,var(--accent1),var(--accent2));
    }

    *{box-sizing:border-box;margin:0;padding:0}
    body{
      background: var(--bg);
      color: var(--text);
      font-family: "Inter", system-ui, -apple-system, sans-serif;
      line-height: 1.6;
    }

    header{
      background: linear-gradient(120deg, rgba(108,99,255,0.8), rgba(0,212,255,0.8));
      color: #fff;
      padding: 24px 32px;
      text-align: center;
      font-size: 1.8em;
      font-weight: 700;
      letter-spacing: 0.4px;
      box-shadow: 0 4px 20px rgba(0,0,0,0.1);
    }

    .container{
      max-width: 900px;
      margin: 40px auto;
      background: var(--panel);
      border-radius: 16px;
      box-shadow: 0 6px 24px rgba(0,0,0,0.08);
      padding: 24px;
    }

    .file{
      display:flex;
      justify-content:space-between;
      align-items:center;
      border-bottom:1px solid #e6e9f5;
      padding:14px 0;
      transition: background 0.2s;
    }

    .file:last-child{border-bottom:none;}
    .file:hover{background:#f7f9ff;}

    .file a{
      color:var(--text);
      text-decoration:none;
      font-weight:600;
      display:flex;
      align-items:center;
      gap:10px;
      font-size:15px;
    }

    .file a span.icon{
      font-size:20px;
      background:var(--btn);
      -webkit-background-clip:text;
      -webkit-text-fill-color:transparent;
    }

    button{
      background:var(--btn);
      color:#fff;
      border:none;
      padding:8px 14px;
      border-radius:8px;
      font-weight:600;
      cursor:pointer;
      transition:all .2s ease;
      font-size:14px;
      box-shadow:0 4px 10px rgba(0,0,0,0.15);
    }

    button:hover{
      filter:brightness(1.1);
      transform:translateY(-1px);
    }

    button.copied{
      background:linear-gradient(135deg,#4ade80,#16a34a);
    }

    @media(max-width:600px){
      .file{flex-direction:column;align-items:flex-start;gap:10px;}
      button{align-self:flex-end;}
    }

    .toast{
      position:fixed;
      bottom:24px;
      left:50%;
      transform:translateX(-50%);
      background:var(--btn);
      color:#fff;
      padding:10px 18px;
      border-radius:10px;
      font-weight:600;
      box-shadow:0 6px 18px rgba(0,0,0,0.25);
      opacity:0;
      pointer-events:none;
      transition:opacity .3s ease;
    }
    .toast.show{opacity:1;}
  </style>
</head>
<body>
  <header>📂 GrandMeta Uploads</header>

  <div class="container" id="fileList"></div>
  <div id="toast" class="toast">Link Copied!</div>

  <script>
    const baseURL = "https://grandmeta.github.io/uploads/";
    const files = [
      "A06-95951.pdf",
      "A06-95951_Wiring.pdf",
      "A66-07962.pdf",
      "A66-07962_Wiring.pdf",
      "A66-26638.pdf",
      "A66-26638 _Wiring.pdf",
      "A66-26747.pdf",
      "A66-26747_Wiring.pdf",
      "A66-26638_Powerflow.mp4",
      "A66-26638_Repair.mp4"
    ];

    const container = document.getElementById("fileList");
    const toast = document.getElementById("toast");

    files.forEach(file => {
      const fileLink = baseURL + encodeURIComponent(file.trim());
      const icon = file.toLowerCase().endsWith(".mp4") ? "🎞️" : "📄";
      const fileDiv = document.createElement("div");
      fileDiv.className = "file";
      fileDiv.innerHTML = `
        <a href="${fileLink}" target="_blank"><span class="icon">${icon}</span>${file}</a>
        <button onclick="copyLink('${fileLink}', this)">Copy Link</button>
      `;
      container.appendChild(fileDiv);
    });

    function copyLink(link, button) {
      navigator.clipboard.writeText(link)
        .then(() => {
          button.textContent = 'Copied!';
          button.classList.add('copied');
          showToast();
          setTimeout(() => {
            button.textContent = 'Copy Link';
            button.classList.remove('copied');
          }, 1500);
        })
        .catch(err => alert('Failed to copy: ' + err));
    }

    function showToast() {
      toast.classList.add('show');
      clearTimeout(showToast.timeout);
      showToast.timeout = setTimeout(() => toast.classList.remove('show'), 1200);
    }
  </script>
</body>
</html>
